openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /editorial/assist:
    post:
      operationId: draftEditorial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EditorialInput" }
      responses:
        "200":
          description: AI draft for human review. Never saved or published automatically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EditorialDraft" }
  /site:
    get:
      operationId: getSite
      responses:
        "200":
          description: Published content, never unpublished drafts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteState" }
  /admin/site:
    get:
      operationId: getSiteDraft
      responses:
        "200":
          description: Admin draft and version history.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDraft" }
    put:
      operationId: saveSiteDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteEdit" }
      responses:
        "200":
          description: Saved with optimistic concurrency.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDraft" }
  /admin/site/publish:
    post:
      operationId: publishSite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteRevisionInput" }
      responses:
        "200":
          description: Published atomically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDraft" }
  /admin/site/restore:
    post:
      operationId: restoreSite
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiteRestoreInput" }
      responses:
        "200":
          description: Historical version restored into draft only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SiteDraft" }
  /operations:
    get:
      operationId: getOperations
      responses:
        "200":
          description: Private role-scoped operational data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Operations" }
  /admin/applications/{id}:
    patch:
      operationId: reviewApplication
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationDecision" }
      responses:
        "200":
          description: Applicant reviewed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /admin/briefs/{id}:
    patch:
      operationId: updateBrief
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BriefStageInput" }
      responses:
        "200":
          description: Corporate pipeline updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /orders/{id}/fulfilment:
    patch:
      operationId: updateFulfilment
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FulfilmentInput" }
      responses:
        "200":
          description: Safe fulfilment transition recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /maker/brand:
    put:
      operationId: saveMakerBrand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MakerBrandInput" }
      responses:
        "200":
          description: Owned maker profile saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /maker/products/{id}/images:
    put:
      operationId: saveProductImages
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductImagesInput" }
      responses:
        "200":
          description: Draft images replaced atomically.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /catalog:
    get:
      operationId: getCatalog
      responses:
        "200":
          description: Public catalogue. Sample mode is explicit.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Catalog" }
  /runtime:
    get:
      operationId: getRuntime
      responses:
        "200":
          description: Public integration capabilities, never service credentials.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Runtime" }
  /recommendations:
    post:
      operationId: findGifts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GiftInput" }
      responses:
        "200":
          description: Explainable catalogue matches, not live AI.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GiftResults" }
  /applications:
    post:
      operationId: applyToSell
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationInput" }
      responses:
        "201":
          description: Persisted application.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /corporate:
    post:
      operationId: createBrief
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BriefInput" }
      responses:
        "201":
          description: Persisted brief.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /workspace:
    get:
      operationId: getWorkspace
      responses:
        "200":
          description: Role-scoped workspace; requires a verified Supabase session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
  /sample/session:
    post:
      operationId: createSampleSession
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleIdentityInput" }
      responses:
        "201":
          description: Explicitly simulated, server-backed sample identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleSession" }
    get:
      operationId: getSampleSession
      responses:
        "200":
          description: Current sample identity, never a Supabase identity.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleIdentity" }
    delete:
      operationId: endSampleSession
      responses:
        "200":
          description: Sample session ended.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /sample/shopper:
    get:
      operationId: getSampleShopperAccount
      responses:
        "200":
          description: Own sample shopper orders, classes, addresses, and wishlist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleShopperAccount" }
  /sample/maker/products:
    get:
      operationId: getSampleMakerStocks
      responses:
        "200":
          description: Stock for the signed-in sample maker's own products.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerStocksResponse" }
  /sample/maker/products/{productId}/stock:
    put:
      operationId: updateSampleMakerStock
      parameters:
        - { in: path, name: productId, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleMakerStockInput" }
      responses:
        "200":
          description: Stock saved for a product owned by the signed-in sample maker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerStock" }
  /sample/maker/orders:
    get:
      operationId: getSampleMakerOrders
      responses:
        "200":
          description: Orders for the signed-in sample maker's own shop.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrdersResponse" }
  /sample/admin/orders:
    get:
      operationId: getSampleAdminOrders
      responses:
        "200":
          description: All isolated sample orders for the admin workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOrdersResponse" }
  /sample/orders/{id}/fulfilment:
    patch:
      operationId: updateSampleOrderFulfilment
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleFulfilmentInput" }
      responses:
        "200":
          description: Maker fulfilment update validated and saved to isolated sample data.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOperationalOrder" }
  /sample/admin/orders/{id}/status:
    patch:
      operationId: updateSampleAdminOrderStatus
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleAdminOrderStatusInput" }
      responses:
        "200":
          description: Sample delay or refund status recorded with an admin note; no gateway refund occurs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleOperationalOrder" }
  /sample/maker/earnings:
    get:
      operationId: getSampleMakerEarnings
      responses:
        "200":
          description: Server-calculated sample earnings, deductions, and weekly payout dates for the signed-in maker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerEarnings" }
  /sample/maker/profits:
    get:
      operationId: getSampleMakerProfits
      responses:
        "200":
          description: Maker-only product contribution margins with private costs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerProfitsResponse" }
  /sample/maker/settings:
    get:
      operationId: getSampleMakerSettings
      responses:
        "200":
          description: Own sample-maker trust and tax settings, without bank account details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerSettings" }
    put:
      operationId: saveSampleMakerSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleMakerSettingsInput" }
      responses:
        "200":
          description: Own sample GST status and state saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerSettings" }
  /sample/maker/opportunities:
    get:
      operationId: getSampleMakerOpportunities
      responses:
        "200":
          description: Maker-only opportunity briefs without corporate identity or contact information.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerOpportunitiesResponse" }
  /sample/maker/opportunities/{id}/response:
    patch:
      operationId: respondSampleMakerOpportunity
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleMakerOpportunityResponseInput" }
      responses:
        "200":
          description: Maker response saved to the private sample workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerOpportunity" }
  /sample/maker/masterclass-proposals:
    post:
      operationId: createSampleMakerMasterclassProposal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleMakerMasterclassProposalInput" }
      responses:
        "201":
          description: Maker proposal saved for admin review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerMasterclassProposal" }
  /sample/admin/masterclass-proposals:
    get:
      operationId: getSampleAdminMasterclassProposals
      responses:
        "200":
          description: Admin-only sample class proposals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleAdminMasterclassProposalsResponse" }
  /sample/admin/masterclass-proposals/{id}:
    patch:
      operationId: reviewSampleAdminMasterclassProposal
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleAdminMasterclassReviewInput" }
      responses:
        "200":
          description: Admin review saved for the sample proposal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerMasterclassProposal" }
  /sample/maker/products/{productId}/cost:
    put:
      operationId: saveSampleMakerProductCost
      parameters:
        - { in: path, name: productId, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleMakerProductCostInput" }
      responses:
        "200":
          description: Server-calculated private contribution margin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerProductCost" }
  /sample/maker/drafts:
    get:
      operationId: getSampleMakerDrafts
      responses:
        "200":
          description: Private drafts belonging only to the signed-in sample maker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerDraftsResponse" }
    post:
      operationId: createSampleMakerDraft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleMakerDraftInput" }
      responses:
        "201":
          description: Private sample product draft created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerDraft" }
  /sample/maker/drafts/{id}:
    get:
      operationId: getSampleMakerDraft
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      responses:
        "200":
          description: Private draft belonging to the signed-in sample maker.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerDraft" }
    put:
      operationId: saveSampleMakerDraft
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleMakerDraftInput" }
      responses:
        "200":
          description: Private sample product draft saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleMakerDraft" }
  /sample/maker/drafts/{id}/submit:
    post:
      operationId: submitSampleMakerDraft
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleProductSubmissionInput" }
      responses:
        "200":
          description: Server-validated sample submission after maker facts are confirmed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleProductSubmissionResponse" }
  /sample/admin/payouts:
    get:
      operationId: getSampleAdminPayouts
      responses:
        "200":
          description: Eligible unpaid sample payout runs and recorded paid runs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleAdminPayoutsResponse" }
  /sample/admin/product-reviews:
    get:
      operationId: getSampleAdminProductReviews
      responses:
        "200":
          description: Sample product review queue without private maker costs.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleAdminProductReviewsResponse" }
  /sample/admin/product-reviews/{id}:
    patch:
      operationId: reviewSampleAdminProduct
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleAdminProductReviewInput" }
      responses:
        "200":
          description: Server-validated sample listing decision.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleAdminProductReview" }
  /sample/admin/vendor-applications:
    get:
      operationId: getSampleAdminVendorApplications
      responses:
        "200":
          description: Admin-only sample maker application queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleAdminVendorApplicationsResponse" }
  /sample/admin/vendor-applications/{id}:
    patch:
      operationId: decideSampleAdminVendorApplication
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleAdminVendorApplicationDecisionInput" }
      responses:
        "200":
          description: Admin decision saved to the sample application record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleVendorApplication" }
  /sample/corporate/enquiries:
    post:
      operationId: createSampleCorporateEnquiry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleCorporateEnquiryInput" }
      responses:
        "201":
          description: An isolated sample-only corporate enquiry; no CRM or messaging provider is contacted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCorporateEnquiryCreated" }
  /sample/admin/enquiries:
    get:
      operationId: getSampleAdminCorporateEnquiries
      responses:
        "200":
          description: Admin-only corporate enquiry records, including private buyer contact details.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleAdminCorporateEnquiriesResponse" }
  /sample/admin/overview:
    get:
      operationId: getSampleAdminOverview
      responses:
        "200":
          description: Server-calculated sample dashboard totals and current attention items.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleAdminOverview" }
  /sample/admin/academy:
    get:
      operationId: getSampleAdminAcademySales
      responses:
        "200":
          description: Sample and imported live-workshop sale rows and totals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleAdminAcademySalesResponse" }
  /sample/admin/academy/import:
    post:
      operationId: importSampleAdminAcademyCsv
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleAdminAcademyCsvInput" }
      responses:
        "200":
          description: Validated live-workshop CSV rows stored in the isolated sample Academy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleAdminAcademyImportResponse" }
  /sample/admin/enquiries/{ref}/stage:
    patch:
      operationId: updateSampleAdminCorporateStage
      parameters:
        - { in: path, name: ref, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleCorporateStageInput" }
      responses:
        "200":
          description: Corporate enquiry stage saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCorporateEnquiry" }
  /sample/admin/enquiries/{ref}/matches:
    put:
      operationId: matchSampleAdminCorporateMakers
      parameters:
        - { in: path, name: ref, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleCorporateMatchesInput" }
      responses:
        "200":
          description: Maker matches are saved; maker briefs omit corporate identity and contact.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCorporateEnquiry" }
  /sample/admin/enquiries/{ref}/quote:
    put:
      operationId: saveSampleAdminCorporateQuote
      parameters:
        - { in: path, name: ref, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleCorporateQuoteInput" }
      responses:
        "200":
          description: Quote amount saved to the sample corporate enquiry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCorporateEnquiry" }
  /sample/admin/payouts/{makerId}/{date}/paid:
    post:
      operationId: recordSamplePayoutPaid
      parameters:
        - { in: path, name: makerId, required: true, schema: { type: string, minLength: 1, maxLength: 60 } }
        - { in: path, name: date, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
      responses:
        "200":
          description: An eligible run recorded as paid once; no bank transfer is initiated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SamplePaidPayoutReceipt" }
  /sample/admin/coupons:
    get:
      operationId: getSampleCoupons
      responses:
        "200":
          description: Coupons in the isolated sample workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCouponsResponse" }
    post:
      operationId: createSampleCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleCouponInput" }
      responses:
        "201":
          description: Sample coupon created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCoupon" }
  /sample/admin/coupons/{id}:
    put:
      operationId: updateSampleCoupon
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleCouponInput" }
      responses:
        "200":
          description: Sample coupon updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCoupon" }
  /sample/blog:
    get:
      operationId: getSampleBlog
      responses:
        "200":
          description: Published sample blog posts; draft posts remain private.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleBlogResponse" }
  /sample/admin/blog:
    get:
      operationId: getSampleAdminBlog
      responses:
        "200":
          description: All sample blog posts for the admin workspace.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleBlogResponse" }
    post:
      operationId: createSampleBlogPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleBlogPostInput" }
      responses:
        "201":
          description: Sample blog post created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleBlogPost" }
  /sample/admin/blog/{id}:
    put:
      operationId: updateSampleBlogPost
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleBlogPostInput" }
      responses:
        "200":
          description: Sample blog post updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleBlogPost" }
  /sample/shopper/checkout:
    post:
      operationId: createSampleCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleCheckoutInput" }
      responses:
        "201":
          description: Sample order saved without taking a payment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCheckoutResult" }
        "200":
          description: Idempotent replay of the saved sample order.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleCheckoutResult" }
  /sample/shopper/wishlist/{productId}:
    put:
      operationId: updateSampleWishlist
      parameters:
        - { in: path, name: productId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleWishlistInput" }
      responses:
        "200":
          description: Sample wishlist updated on the server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /sample/shopper/addresses:
    post:
      operationId: addSampleAddress
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleAddressInput" }
      responses:
        "201":
          description: Sample address saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /sample/shopper/addresses/{id}/default:
    patch:
      operationId: setSampleDefaultAddress
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Own sample address set as default.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /sample/shopper/addresses/{id}:
    delete:
      operationId: deleteSampleAddress
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        "200":
          description: Own sample address removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /sample/reset:
    post:
      operationId: resetSampleData
      responses:
        "200":
          description: Isolated sample records reset; no live database is touched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /maker/products:
    post:
      operationId: saveProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "200":
          description: Saved private draft.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /maker/products/{id}/submit:
    post:
      operationId: submitProduct
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Submitted through the database review workflow.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /admin/review:
    post:
      operationId: reviewProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Recorded review.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    EditorialInput:
      type: object
      additionalProperties: false
      required: [purpose, facts, tone]
      properties:
        task: { type: string, enum: [draft, rewrite], default: draft }
        purpose: { type: string, enum: [story, product, caption] }
        facts: { type: string, minLength: 20, maxLength: 8000 }
        currentText: { type: string, maxLength: 8000 }
        tone: { type: string, enum: [warm, celebratory, editorial] }
    EditorialDraft:
      type: object
      required: [text, disclosure]
      properties:
        text: { type: string }
        disclosure: { type: string }
    SiteLink:
      type: object
      additionalProperties: false
      required: [label, href]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        href: { type: string, minLength: 1, maxLength: 500 }
    SiteTheme:
      type: object
      additionalProperties: false
      required: [background, surface, primary, secondary, accent, ink, muted, headingFont, bodyFont, radius, spacing, motion, ornament]
      properties:
        background: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        surface: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        primary: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        secondary: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        accent: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        ink: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        muted: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        headingFont: { type: string, enum: [garamond, cormorant, georgia] }
        bodyFont: { type: string, enum: [inter, system, georgia, garamond] }
        radius: { type: integer, minimum: 0, maximum: 28 }
        spacing: { type: string, enum: [compact, comfortable, generous] }
        motion: { type: boolean }
        ornament: { type: boolean }
    SiteBrand:
      type: object
      additionalProperties: false
      required: [name, tagline, logo, mark, announcement, footerTitle, footerText, copyright]
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        tagline: { type: string, maxLength: 120 }
        logo: { type: string, maxLength: 500 }
        mark: { type: string, maxLength: 500 }
        announcement: { type: string, maxLength: 180 }
        footerTitle: { type: string, maxLength: 120 }
        footerText: { type: string, maxLength: 1000 }
        copyright: { type: string, maxLength: 180 }
    SiteChapter:
      type: object
      additionalProperties: false
      required: [id, title, body, image, imageAlt, quote]
      properties:
        id: { type: string, minLength: 1, maxLength: 60 }
        title: { type: string, minLength: 1, maxLength: 140 }
        body: { type: string, maxLength: 2500 }
        image: { type: string, maxLength: 500 }
        imageAlt: { type: string, maxLength: 240 }
        quote: { type: string, maxLength: 600 }
    SiteStory:
      type: object
      additionalProperties: false
      required: [id, maker, title, intro, image, imageAlt, sponsored, sample, visible, chapters, link]
      properties:
        analyticsKey:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Opaque persistence-owned measurement key. Optional for legacy imports; never editable editorial text.
        id: { type: string, pattern: '^[a-z0-9-]{1,60}$' }
        maker: { type: string, maxLength: 100 }
        title: { type: string, minLength: 1, maxLength: 140 }
        intro: { type: string, maxLength: 700 }
        image: { type: string, maxLength: 500 }
        imageAlt: { type: string, maxLength: 240 }
        sponsored: { type: boolean }
        sample: { type: boolean }
        visible: { type: boolean }
        chapters: { type: array, minItems: 1, maxItems: 8, items: { $ref: "#/components/schemas/SiteChapter" } }
        link: { $ref: "#/components/schemas/SiteLink" }
    SiteSection:
      type: object
      additionalProperties: false
      required: [id, type, visible, eyebrow, title, text, image, imageAlt, tone, layout, link, storyId, productIds]
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{1,60}$' }
        type: { type: string, enum: [hero, story, products, maker, quiz, invitation] }
        visible: { type: boolean }
        eyebrow: { type: string, maxLength: 120 }
        title: { type: string, maxLength: 180 }
        text: { type: string, maxLength: 1500 }
        image: { type: string, maxLength: 500 }
        imageAlt: { type: string, maxLength: 240 }
        tone: { type: string, enum: [light, dark, accent] }
        layout: { type: string, enum: [editorial, centred, split] }
        link: { $ref: "#/components/schemas/SiteLink" }
        storyId: { type: string, maxLength: 60 }
        productIds: { type: array, maxItems: 12, items: { type: string, maxLength: 100 } }
    SiteTrunkCard:
      type: object
      additionalProperties: false
      required: [id, title, caption, image, imageAlt, sponsored, link]
      properties:
        analyticsKey:
          type: string
          pattern: '^[0-9a-f]{32}$'
          description: Opaque persistence-owned measurement key. Optional for legacy imports; never editable editorial text.
        id: { type: string, pattern: '^[a-z0-9-]{1,60}$' }
        title: { type: string, minLength: 1, maxLength: 90 }
        caption: { type: string, maxLength: 150 }
        image: { type: string, maxLength: 500 }
        imageAlt: { type: string, maxLength: 240 }
        sponsored: { type: boolean }
        link: { $ref: "#/components/schemas/SiteLink" }
    SitePage:
      type: object
      additionalProperties: false
      required: [id, title, description, eyebrow, heading, intro, image, imageAlt]
      properties:
        id: { type: string, pattern: '^[a-z0-9-]{1,60}$' }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 300 }
        eyebrow: { type: string, maxLength: 120 }
        heading: { type: string, maxLength: 180 }
        intro: { type: string, maxLength: 1500 }
        image: { type: string, maxLength: 500 }
        imageAlt: { type: string, maxLength: 240 }
    SiteDocument:
      type: object
      additionalProperties: false
      required: [brand, theme, navigation, footerLinks, sections, stories, trunkCards, pages, labels]
      properties:
        brand: { $ref: "#/components/schemas/SiteBrand" }
        theme: { $ref: "#/components/schemas/SiteTheme" }
        navigation: { type: array, maxItems: 8, items: { $ref: "#/components/schemas/SiteLink" } }
        footerLinks: { type: array, maxItems: 16, items: { $ref: "#/components/schemas/SiteLink" } }
        sections: { type: array, minItems: 1, maxItems: 20, items: { $ref: "#/components/schemas/SiteSection" } }
        stories: { type: array, maxItems: 20, items: { $ref: "#/components/schemas/SiteStory" } }
        trunkCards: { type: array, minItems: 1, maxItems: 3, items: { $ref: "#/components/schemas/SiteTrunkCard" } }
        pages: { type: array, maxItems: 30, items: { $ref: "#/components/schemas/SitePage" } }
        labels: { type: object, additionalProperties: { type: string, maxLength: 500 } }
    SiteState:
      type: object
      required: [document, revision, configured, updatedAt]
      properties:
        document: { $ref: "#/components/schemas/SiteDocument" }
        revision: { type: integer }
        configured: { type: boolean }
        updatedAt: { type: string }
    SiteVersion:
      type: object
      required: [id, publishedAt]
      properties:
        id: { type: integer }
        publishedAt: { type: string }
    SiteDraft:
      type: object
      required: [document, revision, publishedRevision, updatedAt, history]
      properties:
        document: { $ref: "#/components/schemas/SiteDocument" }
        revision: { type: integer }
        publishedRevision: { type: integer }
        updatedAt: { type: string }
        history: { type: array, items: { $ref: "#/components/schemas/SiteVersion" } }
    SiteEdit:
      type: object
      required: [document, expectedRevision]
      properties:
        document: { $ref: "#/components/schemas/SiteDocument" }
        expectedRevision: { type: integer, minimum: 0 }
    SiteRevisionInput:
      type: object
      required: [expectedRevision]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
    SiteRestoreInput:
      type: object
      required: [expectedRevision, versionId]
      properties:
        expectedRevision: { type: integer, minimum: 0 }
        versionId: { type: integer, minimum: 1 }
    OperationOrder:
      type: object
      required: [id, ref, status, paymentStatus, totalPaise, createdAt, trackingNumber, carrier]
      properties:
        id: { type: string }
        ref: { type: string }
        status: { type: string }
        paymentStatus: { type: string }
        totalPaise: { type: integer }
        createdAt: { type: string }
        trackingNumber: { type: string }
        carrier: { type: string }
    OperationApplication:
      type: object
      required: [id, brand, contactName, craft, city, status]
      properties:
        id: { type: string }
        brand: { type: string }
        contactName: { type: string }
        craft: { type: string }
        city: { type: string }
        status: { type: string }
    OperationBrief:
      type: object
      required: [id, ref, purpose, company, quantity, budgetPaise, neededBy, stage, contactName, reach, message]
      properties:
        id: { type: string }
        ref: { type: string }
        purpose: { type: string }
        company: { type: string }
        quantity: { type: integer }
        budgetPaise: { type: integer }
        neededBy: { type: string }
        stage: { type: string }
        contactName: { type: string }
        reach: { type: string }
        message: { type: string }
        customization: { type: string }
        deliveryCities: { type: string }
        referenceUrl: { type: string }
    Operations:
      type: object
      required: [orders, applications, briefs]
      properties:
        orders: { type: array, items: { $ref: "#/components/schemas/OperationOrder" } }
        applications: { type: array, items: { $ref: "#/components/schemas/OperationApplication" } }
        briefs: { type: array, items: { $ref: "#/components/schemas/OperationBrief" } }
    ApplicationDecision:
      type: object
      required: [decision, note]
      properties:
        decision: { type: string, enum: [approved, declined, call] }
        note: { type: string, maxLength: 1000 }
    BriefStageInput:
      type: object
      required: [stage]
      properties:
        stage: { type: string, enum: [new, contacted, proposal, won, lost] }
    FulfilmentInput:
      type: object
      required: [status, trackingNumber, carrier, note]
      properties:
        status: { type: string, enum: [packed, dispatched, delayed, problem] }
        trackingNumber: { type: string, maxLength: 120 }
        carrier: { type: string, maxLength: 100 }
        note: { type: string, maxLength: 1000 }
    MakerBrandInput:
      type: object
      required: [tagline, story, heroImage]
      properties:
        tagline: { type: string, minLength: 1, maxLength: 240 }
        story: { type: string, minLength: 1, maxLength: 6000 }
        heroImage: { type: string, maxLength: 500 }
    ProductImagesInput:
      type: object
      required: [images]
      properties:
        images: { type: array, minItems: 1, maxItems: 8, items: { type: string, minLength: 1, maxLength: 500 } }
    Runtime:
      type: object
      required: [database, auth, payments, ai, supabaseUrl, supabaseAnonKey, message]
      properties:
        database: { type: boolean }
        auth: { type: boolean }
        payments: { type: boolean }
        ai: { type: boolean }
        supabaseUrl: { type: string }
        supabaseAnonKey: { type: string }
        message: { type: string }
    Maker:
      type: object
      required: [id, slug, brand, craft, tagline, story, image]
      properties:
        id: { type: string }
        slug: { type: string }
        brand: { type: string }
        craft: { type: string }
        tagline: { type: string }
        story: { type: string }
        image: { type: string }
    Product:
      type: object
      required: [id, slug, makerId, name, pricePaise, image, category, material, description, dispatchDays, stock, sample]
      properties:
        id: { type: string }
        slug: { type: string }
        makerId: { type: string }
        name: { type: string }
        pricePaise: { type: integer }
        image: { type: string }
        category: { type: string }
        material: { type: string }
        description: { type: string }
        dispatchDays: { type: integer }
        stock: { type: integer }
        sample: { type: boolean }
        status: { type: string }
        reviewNote: { type: string }
    Catalog:
      type: object
      required: [sample, products, makers]
      properties:
        sample: { type: boolean }
        products: { type: array, items: { $ref: "#/components/schemas/Product" } }
        makers: { type: array, items: { $ref: "#/components/schemas/Maker" } }
    GiftInput:
      type: object
      required: [recipient, occasion, feeling, budgetPaise]
      properties:
        recipient: { type: string, maxLength: 40 }
        occasion: { type: string, maxLength: 40 }
        feeling: { type: string, maxLength: 40 }
        budgetPaise: { type: integer, minimum: 100, maximum: 100000000 }
    GiftMatch:
      type: object
      required: [product, reason]
      properties:
        product: { $ref: "#/components/schemas/Product" }
        reason: { type: string }
    GiftResults:
      type: object
      required: [sample, matches, message]
      properties:
        sample: { type: boolean }
        matches: { type: array, items: { $ref: "#/components/schemas/GiftMatch" } }
        message: { type: string }
    ApplicationInput:
      type: object
      required: [brand, contactName, phone, craft, city, state, gstRegistered]
      properties:
        brand: { type: string, minLength: 1, maxLength: 150 }
        contactName: { type: string, minLength: 1, maxLength: 150 }
        phone: { type: string, pattern: '^[6-9][0-9]{9}$' }
        craft: { type: string, minLength: 1, maxLength: 200 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 1, maxLength: 100 }
        gstRegistered: { type: boolean }
        gstin: { type: string, maxLength: 15 }
        link: { type: string, maxLength: 400 }
    BriefInput:
      type: object
      required: [purpose, quantity, budgetPaise, neededBy, contactName, company, message]
      properties:
        purpose: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: integer, minimum: 1, maximum: 100000 }
        budgetPaise:
          type: integer
          minimum: 100
          maximum: 100000000
          description: Budget per gift in integer paise, not the total brief budget.
        neededBy: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        contactName: { type: string, minLength: 1, maxLength: 150 }
        company: { type: string, minLength: 1, maxLength: 150 }
        email: { type: string, format: email, maxLength: 250 }
        reach:
          type: string
          minLength: 1
          maxLength: 250
          description: Work email or Indian mobile number. Either reach or the legacy email field is required.
        customization: { type: string, maxLength: 1000 }
        deliveryCities: { type: string, maxLength: 1000 }
        referenceUrl: { type: string, maxLength: 1000 }
        message: { type: string, maxLength: 4000 }
    ProductInput:
      type: object
      required: [name, pricePaise, stock, material, description, dispatchDays, factualConfirmation]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1, maxLength: 200 }
        pricePaise: { type: integer, minimum: 100, maximum: 100000000 }
        stock: { type: integer, minimum: 0, maximum: 100000 }
        material: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, minLength: 1, maxLength: 5000 }
        dispatchDays: { type: integer, minimum: 1, maximum: 60 }
        factualConfirmation: { type: boolean }
    ReviewInput:
      type: object
      required: [productId, decision, handmade, material, photos, price, story, note]
      properties:
        productId: { type: string }
        decision: { type: string, enum: [approved, changes] }
        handmade: { type: boolean }
        material: { type: boolean }
        photos: { type: boolean }
        price: { type: boolean }
        story: { type: boolean }
        note: { type: string, maxLength: 3000 }
    Receipt:
      type: object
      required: [id, message]
      properties:
        id: { type: string }
        message: { type: string }
    Workspace:
      type: object
      required: [userId, email, roles, products, ordersCount, applicationsCount, briefsCount]
      properties:
        userId: { type: string }
        email: { type: string }
        roles: { type: array, items: { type: string } }
        maker: { $ref: "#/components/schemas/Maker" }
        products: { type: array, items: { $ref: "#/components/schemas/Product" } }
        ordersCount: { type: integer }
        applicationsCount: { type: integer }
        briefsCount: { type: integer }
    SampleIdentityInput:
      type: object
      additionalProperties: false
      required: [identity, mobileNumber, simulationCode]
      properties:
        identity:
          type: string
          enum: [shopper, shopper-other, maker, maker-other, admin]
        mobileNumber: { type: string, pattern: "^[6-9][0-9]{9}$" }
        simulationCode: { type: string, pattern: "^246810$" }
    SampleIdentity:
      type: object
      required: [sample, identity, role, userId, displayName]
      properties:
        sample: { type: boolean, const: true }
        identity: { type: string }
        role: { type: string, enum: [shopper, maker, admin] }
        userId: { type: string }
        displayName: { type: string }
    SampleSession:
      allOf:
        - $ref: "#/components/schemas/SampleIdentity"
        - type: object
          required: [token, expiresAt]
          properties:
            token: { type: string }
            expiresAt: { type: string }
    SampleOrder:
      type: object
      required: [id, reference, status, placedOn, totalPaise, discountPaise, couponCode, items, trackingNumber, carrier, delayNote]
      properties:
        id: { type: string }
        reference: { type: string }
        status: { type: string, enum: [placed, packed, on_the_way, delivered, delayed] }
        placedOn: { type: string }
        totalPaise: { type: integer }
        discountPaise: { type: integer, minimum: 0 }
        couponCode: { type: ["string", "null"] }
        items: { type: array, items: { type: string } }
        trackingNumber: { type: string }
        carrier: { type: string }
        delayNote: { type: string }
    SampleClass:
      type: object
      required: [id, title, teacher, access, schedule]
      properties:
        id: { type: string }
        title: { type: string }
        teacher: { type: string }
        access: { type: string, enum: [recorded, live] }
        schedule: { type: string }
    SampleAddress:
      type: object
      required: [id, name, phone, line1, line2, city, state, pin, isDefault]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 15 }
        line1: { type: string, maxLength: 200 }
        line2: { type: string, maxLength: 200 }
        city: { type: string, maxLength: 100 }
        state: { type: string, maxLength: 100 }
        pin: { type: string, pattern: '^[1-9][0-9]{5}$' }
        isDefault: { type: boolean }
    SampleShopperAccount:
      type: object
      required: [sample, displayName, orders, classes, addresses, wishlist]
      properties:
        sample: { type: boolean, const: true }
        displayName: { type: string }
        orders: { type: array, items: { $ref: "#/components/schemas/SampleOrder" } }
        classes: { type: array, items: { $ref: "#/components/schemas/SampleClass" } }
        addresses: { type: array, items: { $ref: "#/components/schemas/SampleAddress" } }
        wishlist: { type: array, items: { type: string } }
    SampleMakerStock:
      type: object
      required: [id, stock]
      properties:
        id: { type: string }
        stock: { type: integer, minimum: 0, maximum: 10000 }
    SampleMakerStocksResponse:
      type: object
      required: [sample, products]
      properties:
        sample: { type: boolean, const: true }
        products: { type: array, items: { $ref: "#/components/schemas/SampleMakerStock" } }
    SampleMakerStockInput:
      type: object
      additionalProperties: false
      required: [stock]
      properties:
        stock: { type: integer, minimum: 0, maximum: 10000 }
    SampleMakerDraft:
      type: object
      required: [id, name, kind, material, technique, size, pricePaise, gstPct, stock, dispatchDays, madeToOrder, costPaise, story, photo, step, updatedAt, status]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string }
        material: { type: string }
        technique: { type: string }
        size: { type: string }
        pricePaise: { type: integer, minimum: 0 }
        gstPct: { type: integer, minimum: 0, maximum: 100 }
        stock: { type: integer, minimum: 0, maximum: 10000 }
        dispatchDays: { type: integer, minimum: 1, maximum: 60 }
        madeToOrder: { type: boolean }
        costPaise: { type: integer, minimum: 0 }
        story: { type: string }
        photo: { type: string, maxLength: 300000 }
        step: { type: integer, minimum: 1, maximum: 7 }
        updatedAt: { type: string, format: date-time }
        status: { type: string, enum: [draft, submitted, live, changes] }
    SampleMakerDraftInput:
      type: object
      additionalProperties: false
      required: [name, kind, material, technique, size, pricePaise, gstPct, stock, dispatchDays, madeToOrder, costPaise, story, photo, step]
      properties:
        name: { type: string, maxLength: 200 }
        kind: { type: string, maxLength: 200 }
        material: { type: string, maxLength: 500 }
        technique: { type: string, maxLength: 500 }
